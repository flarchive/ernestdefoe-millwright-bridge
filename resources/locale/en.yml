ernestdefoe-millwright-bridge:
  admin:
    intro: "Upgrades this forum to Flarum 2 in three steps. Nothing changes until the last one, and if anything goes wrong during it, the forum is put back exactly as it was."
    step_check: "1. Check"
    step_build: "2. Build Flarum 2"
    step_upgrade: "3. Upgrade"
    php: "This forum runs PHP {version}."
    can_upgrade: "Everything is ready for Flarum 2."
    check_again: "Check again"
    check_failed: "The check could not be run. Reload the page and try again."
    col_extension: Extension
    col_now: Installed
    col_flarum2: Flarum 2
    status_ok: "Ready {version}"
    status_none: "No Flarum 2 release: remove it first"
    status_php: "Its Flarum 2 release ({version}) needs PHP {php}"
    status_local: "Local package that requires Flarum 1: remove it first"
    status_replaced: "Becomes {replacement}"
    status_retired: "Removed by the upgrade: not needed on Flarum 2"
    status_retired_by: "Removed by the upgrade: replaced by {replacement}"
    status_self: "Removed by the upgrade: Millwright takes over"
    status_unknown: "Not on Packagist: checked while building"
    build_help: "Builds the complete Flarum 2 install beside this forum, which keeps running normally. If Flarum 2 cannot be built for this forum, you will see why, and nothing will have changed."
    build: "Build Flarum 2"
    build_again: "Build again"
    built: "Flarum {version} is built and ready to swap in."
    stage_failed: "Building Flarum 2 did not finish. Nothing on the forum has changed. Try again, or run `php flarum bridge:upgrade` from the command line to see the full output."
    upgrade_help: "Backs up the database and settings, swaps Flarum 2 in, and updates the database. The forum is unavailable for a minute or two. If the forum does not answer afterwards, everything is put back automatically. Millwright is installed to keep Flarum 2 up to date from here on."
    upgrade: "Back up and upgrade to Flarum 2"
    upgrading: "Upgrading. Keep this page open; this takes a minute or two."
    confirm: "Upgrade to Flarum 2 now? The forum is unavailable for a minute or two while this runs."
    done_title: "This forum now runs Flarum {version}"
    done_help: "Reload to open the Flarum 2 admin. Millwright, the updater for Flarum 2, is installed and switched on."
    open_admin: "Open the Flarum 2 admin"
    failed_title: "The upgrade did not complete"
    reload: Reload
    lost_contact: "The page lost contact with the forum while upgrading. Reload: the forum will show whether it is now on Flarum 2 or was put back on Flarum 1. If it shows an error instead, run `php storage/bridge/undo.php`."

  api:
    unknown_action: Unknown action.
    must_fix_first: The check found something that must be fixed first.
    composer_failed: Composer could not work out a Flarum 2 install for this forum. Nothing has changed.
    build_first: Build Flarum 2 first.
    fix_first: "The check found something to fix first: {blockers}"
    backup_failed: "The backup failed, so nothing was changed: {error}"
    restore_failed: "The upgrade failed ({error}) and putting it back also failed ({restore_error}). Run `php storage/bridge/undo.php`, or run it from your host's cron, to finish."
    rolled_back: "The upgrade failed, so Flarum 1 has been put back: {error}"
    undone_database: database restored from the backup
    undone_files: Flarum 1's files moved back
    undone_config: composer.json, composer.lock and config.php restored
    undone_caches: caches cleared
    php_too_old: "Flarum 2 needs PHP {min} or newer, and this forum runs {version}. Ask your host to switch this site to PHP 8.3 or 8.4 (it is usually a setting in the control panel), then check again."
    path_not_writable: "{path} cannot be changed by the web server, so the upgrade could not swap it. Fix its permissions and check again."
    vendor_locked: "{count} folder(s) in vendor/ cannot be changed by the web server, for example {first}. This usually comes from running composer as root. Give them back with `chown -R {user} vendor`, then check again."
    vendor_locked_owner: "{count} folder(s) in vendor/ cannot be changed by the web server (they belong to {owner}), for example {first}. This usually comes from running composer as root. Give them back with `chown -R {user} vendor`, then check again."
    base_not_writable: "The forum's folder ({path}) cannot be changed by the web server, and the upgrade builds Flarum 2 there, beside vendor/. Fix its permissions and check again."
    storage_not_writable: storage/ is not writable, and the upgrade builds Flarum 2 and keeps its backups there.
    disk_space: "There is not enough free disk space. The upgrade keeps the current version beside the new one so it can be put back, which needs about {needed} free; there is {free}."
    memory_note: "PHP's memory limit is {limit}. Working out the Flarum 2 install can need more; the upgrade raises it where the host allows, and says so if it cannot."
    proc_open_note: "This host does not let PHP start other processes, so the database update will be done through Flarum 2's own updater instead of the command line. That is supported; it is just slower."
    curl_note: "PHP's curl extension is missing, so the site cannot be checked after the upgrade and a failed upgrade would not be put back automatically."
    no_url: "config.php has no url, so the forum cannot be checked after the upgrade."
    ext_local: "{name} is a local package in this forum's own folders, and it requires Flarum 1. Remove it with `composer remove {name}`, or update its composer.json for Flarum 2, then check again."
    ext_php: "{name}'s Flarum 2 release ({version}) needs PHP {php}, and this forum runs {current}. Switch the site to a newer PHP in your host's control panel, or remove {name}, then check again."
    ext_none: "{name} has no release that works with Flarum 2. Remove it (in Extension Manager or with `composer remove {name}`) or wait for its author, then check again."
    ext_unknown: "{name} is not on Packagist, so it could not be checked here. If it has no Flarum 2 release, building Flarum 2 will stop and say so, before anything changes."
